name: Firebase Security Rules & Functions CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rules-and-functions-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dispatch_dashboard/functions/package-lock.json

      - name: Install Functions Dependencies
        working-directory: dispatch_dashboard/functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: dispatch_dashboard/functions
        run: npm run build

      - name: Run Security Rules Unit Tests
        working-directory: dispatch_dashboard/functions
        run: npm test
